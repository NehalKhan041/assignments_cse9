<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ABC College Admission 2026</title>
<style>
  body { font-family: Georgia, serif; margin: 0; }
  header, footer { background: #1a237e; color: #fff; text-align: center; margin: 10px auto; width: 80%; }
  header { padding: 25px 0; }
  header h1 { margin: 0; }
  footer { padding: 8px 0; font-size: 14px; }
  main { width: 60%; margin: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #888; padding: 4px 6px; text-align: left; }
  th { background: #e3e8f7; text-align: center; }
  fieldset { margin-top: 15px; }
  input[type=text], input[type=email] { width: 240px; }
</style>
</head>
<body>
<header>
  <h1>ABC College Admission 2026</h1>
</header>

<main>
  <section>
    <h2>Courses and Fees</h2>
    <table>
      <caption>Available Courses</caption>
      <thead>
        <tr><th>Course</th><th>Seats</th><th>Fees</th></tr>
      </thead>
      <tbody>
        <tr><td>B.Tech CSE</td><td>120</td><td>₹90,000</td></tr>
        <tr><td>BCA</td><td>60</td><td>₹45,000</td></tr>
      </tbody>
    </table>
  </section>
    <section>
    <form>
      <fieldset>
        <legend>Application Form</legend>
        <p><label for="n">Name:</label><br><input type="text" id="n" name="name" required></p>
        <p><label for="e">Email:</label><br><input type="email" id="e" name="email" required></p>
        <p><label for="c">Course:</label><br>
          <select id="c" name="course">
            <option>B.Tech CSE</option>
            <option>BCA</option>
          </select>
        </p>
        <p><label for="s">Statement:</label><br>
          <textarea id="s" name="statement" rows="4" cols="45"></textarea>
        </p>
        <button type="submit">Apply</button>
      </fieldset>
    </form>
  </section>

  <section>
    <form>
      <fieldset>
        <legend>Application Form</legend>
        <p><label for="n">Name:</label><br><input type="text" id="n" name="name" required></p>
        <p><label for="e">Email:</label><br><input type="email" id="e" name="email" required></p>
        <p><label for="c">Course:</label><br>
          <select id="c" name="course">
            <option>B.Tech CSE</option>
            <option>BCA</option>
          </select>
        </p>
        <p><label for="s">Statement:</label><br>
          <textarea id="s" name="statement" rows="4" cols="45"></textarea>
        </p>
        <button type="submit">Apply</button>
      </fieldset>
    </form>
  </section>
</main>

<footer>
  <p style="margin:0">&copy; 2026 ABC College</p>
</footer>
</body>
</html>
